apiVersion: v1
kind: Namespace
metadata:
  name: devops-bot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-bot
  namespace: devops-bot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devops-bot-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-bot-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devops-bot-reader
subjects:
  - kind: ServiceAccount
    name: devops-bot
    namespace: devops-bot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: devops-bot
spec:
  replicas: 1
  selector:
    matchLabels: {app: chatbot}
  template:
    metadata:
      labels: {app: chatbot}
    spec:
      serviceAccountName: devops-bot
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: chatbot
          image: REPLACE_WITH_YOUR_ARM64_IMAGE:0.5.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DEMO_MODE
              value: "false"
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot
  namespace: devops-bot
spec:
  selector: {app: chatbot}
  ports:
    - port: 80
      targetPort: 8000
