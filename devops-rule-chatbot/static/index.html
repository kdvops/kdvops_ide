<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DevOps Rule Chatbot v0.5.0</title>
  <style>
    body{font:16px system-ui;background:#101827;color:#e9eef8;max-width:760px;margin:30px auto;padding:16px}
    h1{font-size:1.5rem}.chat{height:60vh;overflow:auto;border:1px solid #354052;border-radius:12px;padding:18px}
    .msg{white-space:pre-wrap;margin:12px 0;padding:12px;border-radius:10px;background:#263449}.mine{background:#194e62}
    small{color:#aab7cb}form{display:flex;gap:8px;margin-top:12px}input{flex:1;min-width:0;padding:13px;background:#263449;color:white;border:1px solid #506079;border-radius:8px}
    button{padding:12px 18px;background:#1f9a89;color:white;border:0;border-radius:8px;cursor:pointer}
  </style>
</head>
<body>
  <h1>Asistente Conversacional DevOps</h1>
  <small>Motor basado en reglas · v0.5.0</small>
  <div class="chat" id="chat" aria-live="polite"><div class="msg">Hola. Escribe "ayuda" para empezar.</div></div>
  <form id="form"><input id="message" maxlength="500" autocomplete="off" placeholder="Ej.: pods con errores en ns demo" aria-label="Mensaje" required><button>Enviar</button></form>
  <script>
    let session = null;
    const chat = document.getElementById('chat');
    function add(text, mine = false) {
      const div = document.createElement('div');
      div.className = 'msg' + (mine ? ' mine' : '');
      div.textContent = text;
      chat.append(div);
      chat.scrollTop = chat.scrollHeight;
    }
    document.getElementById('form').addEventListener('submit', async event => {
      event.preventDefault();
      const field = document.getElementById('message');
      const message = field.value.trim();
      if (!message) return;
      field.value = '';
      add(message, true);
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message, session_id: session})
        });
        const data = await response.json();
        if (!response.ok) throw Error(data.detail || 'Error');
        session = data.session_id;
        add(data.reply + (data.items ? '\n' + JSON.stringify(data.items, null, 2) : ''));
      } catch (error) {
        add('Error: ' + error.message);
      }
    });
  </script>
</body>
</html>
