services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-rule-chatbot:0.5.0
    container_name: devops-rule-chatbot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEMO_MODE: "false"
      PYTHONUNBUFFERED: "1"
      KUBECONFIG: /home/chatbot/.kube/config
    volumes:
      - ${USERPROFILE}/.kube:/home/chatbot/.kube:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
