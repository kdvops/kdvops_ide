services:
  kdvops:
    build:
      context: .
      args:
        KDVOPS_UID: ${KDVOPS_UID:-10001}
        KDVOPS_PIP_TRUSTED_HOST: ${KDVOPS_PIP_TRUSTED_HOST:-pypi.org files.pythonhosted.org}
    image: kdvops-cli:local
    stdin_open: true
    tty: true
    init: true
    env_file: .env
    environment:
      KDVOPS_WORKSPACE: /workspace
      KUBECONFIG: /home/kdvops/.kube/config
    volumes:
      - ${HOST_WORKSPACE:?Set HOST_WORKSPACE in .env}:/workspace:rw
      - ${HOST_KUBECONFIG:?Set HOST_KUBECONFIG in .env}:/home/kdvops/.kube/config:ro
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m

  kdvops-tools:
    profiles: [tools]
    build:
      context: .
      args:
        KDVOPS_UID: ${KDVOPS_UID:-10001}
        KDVOPS_PIP_TRUSTED_HOST: ${KDVOPS_PIP_TRUSTED_HOST:-pypi.org files.pythonhosted.org}
    image: kdvops-cli:local
    entrypoint: []
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
    init: true
    environment:
      KUBECONFIG: /home/kdvops/.kube/config
    volumes:
      - ${HOST_WORKSPACE:?Set HOST_WORKSPACE in .env}:/workspace:rw
      - ${HOST_KUBECONFIG:?Set HOST_KUBECONFIG in .env}:/home/kdvops/.kube/config:ro
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m

  kdvops-web:
    profiles: [web]
    build:
      context: .
      args:
        KDVOPS_UID: ${KDVOPS_UID:-10001}
        KDVOPS_PIP_TRUSTED_HOST: ${KDVOPS_PIP_TRUSTED_HOST:-pypi.org files.pythonhosted.org}
    image: kdvops-cli:local
    command: [web]
    init: true
    environment:
      OPENCLAW_API_URL: ${OPENCLAW_API_URL:?Set OPENCLAW_API_URL in .env}
      OPENCLAW_TOKEN: ${OPENCLAW_TOKEN:?Set OPENCLAW_TOKEN in .env}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-openclaw/kdvops}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-}
      KDVOPS_TIMEOUT: ${KDVOPS_TIMEOUT:-300}
      KDVOPS_MAX_TOOL_ITERATIONS: ${KDVOPS_MAX_TOOL_ITERATIONS:-30}
      KDVOPS_TLS_VERIFY: ${KDVOPS_TLS_VERIFY:-true}
      KDVOPS_PRIVACY_MASKING: ${KDVOPS_PRIVACY_MASKING:-true}
      KDVOPS_WEB_TOKEN: ${KDVOPS_WEB_TOKEN:?Set KDVOPS_WEB_TOKEN in .env}
      KDVOPS_WORKSPACE: /workspace
      KUBECONFIG: /home/kdvops/.kube/config
      KDVOPS_WEB_HOST: 0.0.0.0
      KDVOPS_WEB_PORT: 8080
      KDVOPS_HISTORY_DB: /home/kdvops/.local/share/kdvops/history.db
    ports:
      - 127.0.0.1:${KDVOPS_WEB_PORT:-8080}:8080
    volumes:
      - ${HOST_WORKSPACE:?Set HOST_WORKSPACE in .env}:/workspace:rw
      - ${HOST_KUBECONFIG:?Set HOST_KUBECONFIG in .env}:/home/kdvops/.kube/config:ro
      - kdvops-history:/home/kdvops/.local/share/kdvops
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m

volumes:
  kdvops-history:
