[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdvops-cli"
version = "0.1.0"
description = "Container-first supervised coding CLI for OpenClaw-compatible chat endpoints"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "rich>=13,<15", "httpx>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
kdvops = "kdvops.cli:app"

[tool.setuptools.packages.find]
include = ["kdvops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
