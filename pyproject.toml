[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdvops-cli"
version = "0.5.0"
description = "Container-first supervised coding CLI for OpenClaw-compatible chat endpoints"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "rich>=13,<15", "httpx>=0.27,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]

[project.scripts]
kdvops = "kdvops.cli:app"

[tool.setuptools.packages.find]
include = ["kdvops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=kdvops --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["kdvops/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
